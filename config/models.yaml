# Model registry for the FSE 2027 extension.
# NOTE: exact model IDs must be re-verified and pinned at run time (record
# retrieval dates for the paper's artifact). These are sensible initial pins.
# api_key_env references an environment variable; keys never live in this file.
models:
  # ---- OpenAI native API (route reverted 2026-09-05 from Replicate to the
  #      first-party API per user decision; a NEW OPENAI_API_KEY is being
  #      registered — the old key is considered unusable. Lineup verified
  #      2026-08-31: flagship gpt-5.6-sol; reasoning via reasoning_effort
  #      (none..xhigh). NOTE: api.openai.com is TLS-reset from mainland-China
  #      networks — a working HTTPS_PROXY is required at run time; the OpenAI
  #      SDK honors standard proxy env vars.) ----
  - id: openai-gpt56-sol
    provider: openai
    model_id: gpt-5.6-sol
    api_key_env: OPENAI_API_KEY
    reasoning: false
    extra_body:
      reasoning_effort: "none"
  - id: openai-gpt56-sol-thinking
    provider: openai
    model_id: gpt-5.6-sol
    api_key_env: OPENAI_API_KEY
    reasoning: true
    extra_body:
      reasoning_effort: high
    max_tokens: 16384

  # ---- Anthropic native API (route reverted 2026-09-05 from Replicate;
  #      ANTHROPIC_API_KEY being registered. Model: claude-fable-5 (user-
  #      selected flagship, verified on Replicate 2026-09-03). Fable 5 uses
  #      ADAPTIVE thinking by default — no discrete base/thinking split, so
  #      only the base entry is registered (same as the Replicate routing).
  #      NOTE: api.anthropic.com may require HTTPS_PROXY from mainland-China
  #      networks; the Anthropic SDK honors standard proxy env vars.) ----
  - id: claude-fable-5
    provider: anthropic
    model_id: claude-fable-5
    api_key_env: ANTHROPIC_API_KEY
    reasoning: false

  # ---- Google Gemini native API (route reverted 2026-09-05 from Replicate;
  #      GEMINI_API_KEY being registered. Model: gemini-3.1-pro-preview
  #      (verified 2026-08-31; fallback alias gemini-3-pro-latest if the
  #      preview 404s — verify via models.list at key time). Thinking via
  #      thinking_level low/high (no "off" for 3.x Pro): base=low,
  #      thinking=high, wired through extra_body in gemini_adapter.
  #      NOTE: generativelanguage.googleapis.com may require HTTPS_PROXY
  #      from mainland-China networks.) ----
  - id: gemini-3-pro
    provider: gemini
    model_id: gemini-3.1-pro-preview
    api_key_env: GEMINI_API_KEY
    reasoning: false
    extra_body:
      thinking_level: low
  - id: gemini-3-pro-thinking
    provider: gemini
    model_id: gemini-3.1-pro-preview
    api_key_env: GEMINI_API_KEY
    reasoning: true
    extra_body:
      thinking_level: high
    max_tokens: 16384

  # ---- DeepSeek (V4 lineup; verified via GET /v1/models on 2026-08-31.
  #      Legacy aliases deepseek-chat/deepseek-reasoner now resolve to
  #      v4-flash; the flagship is deepseek-v4-pro, a hybrid reasoning model
  #      whose thinking is disabled via the "thinking" extra body.) ----
  - id: deepseek-v4-flash
    provider: deepseek
    model_id: deepseek-v4-flash
    api_key_env: DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com
    reasoning: false
  - id: deepseek-v4-pro
    # 2026-09-10: routed via DashScope (Bailian) at user request — single
    # aliyun account for all China-hosted models. Verified by probe: accepts
    # temperature/top_p on the base path; enable_thinking toggles reasoning
    # (reasoning_content returned). DashScope pricing ¥12/M in + ¥24/M out
    # flat (vs first-party off-peak ~¥4.7/¥14) — chosen for account
    # simplicity, not price. NOTE: all deepseek cells completed before
    # 2026-09-10 used the first-party API (api.deepseek.com).
    provider: dashscope
    model_id: deepseek-v4-pro
    api_key_env: DASHSCOPE_API_KEY
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    reasoning: false
    extra_body:
      enable_thinking: false
  - id: deepseek-v4-pro-thinking
    provider: dashscope
    model_id: deepseek-v4-pro
    api_key_env: DASHSCOPE_API_KEY
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    reasoning: true
    extra_body:
      enable_thinking: true
    # 32k so long reasoning chains don't exhaust the budget before content
    # is emitted (empty-content responses raise + retry client-side).
    # 2026-09-09: raised 16k -> 32k; task 510's reasoning chain exceeded 16k
    # on all 15 attempts (finish_reason=length, empty content). The cap is
    # not a target: samples finishing below 16k are unaffected.
    max_tokens: 32768

  # ---- Qwen (DashScope compatible-mode) ----
  - id: qwen-max
    provider: dashscope
    model_id: qwen-max
    api_key_env: DASHSCOPE_API_KEY
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    reasoning: false
  - id: qwq-plus
    provider: dashscope
    model_id: qwq-plus
    api_key_env: DASHSCOPE_API_KEY
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    reasoning: true
    max_tokens: 8192

  # ---- Kimi (Moonshot) via DashScope (route decided 2026-09-03: user routes
  #      kimi/glm through the Alibaba Bailian (DashScope) account. Verified
  #      via probes on 2026-09-03: 'kimi-k3' present; the host REJECTS
  #      temperature/top_p on ALL paths (thinking-first model — the temp/
  #      top_p grid is NOT runnable for kimi); base/thinking split via
  #      extra_body enable_thinking (verified: false -> no reasoning_content,
  #      true -> reasoning_content present).) ----
  - id: kimi-k3
    provider: dashscope
    model_id: kimi-k3
    api_key_env: DASHSCOPE_API_KEY
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    reasoning: false
    no_sampling: true
    extra_body:
      enable_thinking: false
  - id: kimi-k3-thinking
    provider: dashscope
    model_id: kimi-k3
    api_key_env: DASHSCOPE_API_KEY
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    reasoning: true
    extra_body:
      enable_thinking: true
    max_tokens: 16384

  # ---- GLM (Zhipu) via DashScope (route decided 2026-09-03. Verified on
  #      2026-09-03: glm-5.1 (pinned), glm-5.2, glm-5.2-fast-preview,
  #      ZHIPU/GLM-5.3, ZHIPU/GLM-5.3-Flash, glm-5, glm-4.7 — NOTE: newer
  #      GLM-5.2/5.3 exist; pin kept at glm-5.1 per the 2026-08-31 lineup.
  #      Sampling params ARE accepted; the model thinks BY DEFAULT, so the
  #      base entry must pass enable_thinking: false (verified: reasoning
  #      off/on works).) ----
  - id: glm-5.1
    provider: dashscope
    model_id: glm-5.1
    api_key_env: DASHSCOPE_API_KEY
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    reasoning: false
    extra_body:
      enable_thinking: false
  - id: glm-5.1-thinking
    provider: dashscope
    model_id: glm-5.1
    api_key_env: DASHSCOPE_API_KEY
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    reasoning: true
    extra_body:
      enable_thinking: true
    max_tokens: 16384

  # ---- SAC 2027 (v3): repair-only reasoning. Same settings as the matching
  #      *-thinking entry; the separate id gives these cells their own data
  #      directory, so they repair the reasoning-off round-0 programs
  #      (--gen-source-model <base id>) without touching the r1/r1 cells. ----
  - id: deepseek-v4-pro-repairthink
    provider: dashscope
    model_id: deepseek-v4-pro
    api_key_env: DASHSCOPE_API_KEY
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    reasoning: true
    extra_body:
      enable_thinking: true
    max_tokens: 32768
  - id: openai-gpt56-sol-repairthink
    provider: openai
    model_id: gpt-5.6-sol
    api_key_env: OPENAI_API_KEY
    reasoning: true
    extra_body:
      reasoning_effort: high
    max_tokens: 16384
  - id: kimi-k3-repairthink
    provider: dashscope
    model_id: kimi-k3
    api_key_env: DASHSCOPE_API_KEY
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    reasoning: true
    extra_body:
      enable_thinking: true
    max_tokens: 16384
  - id: glm-5.1-repairthink
    provider: dashscope
    model_id: glm-5.1
    api_key_env: DASHSCOPE_API_KEY
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    reasoning: true
    extra_body:
      enable_thinking: true
    max_tokens: 16384
